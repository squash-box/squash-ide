# Example config for squash-ide.
#
# Copy to ~/.config/squash-ide/config.yaml and edit to taste. Every field
# below can also be overridden by an environment variable (SQUASH_*) or a
# CLI flag; `squash-ide config` prints the resolved values with per-field
# provenance.

# Path to the Obsidian vault that holds tasks/{backlog,active,blocked,archive}/
# and a wiki/ tree. Env: SQUASH_VAULT. Flag: --vault.
vault: ~/GIT/agentic/tasks/personal

# Window-management engine. Env: SQUASH_ENGINE. Flag: --engine.
#   tmux   (default) bootstraps a tmux session and tiles spawned task panes
#          to the right of the TUI — the shipping workflow.
#   native renders an in-process pane region inside the TUI with no tmux
#          dependency. Opt-in / experimental: spawns Claude into native panes
#          with responsive layouts (see `layout` / `focus_follows_input`).
engine: tmux

# Native-engine pane layout strategy (T-040). Ignored under engine: tmux.
# Env: SQUASH_LAYOUT. Flag: --layout.
#   columns     equal vertical columns (the tmux-tiling port); rejects a spawn
#               that would force any pane below its minimum width.
#   stack       panes stacked as full-width rows.
#   tabs        one pane full-region; the rest shown as a tab strip ([ ] cycle).
#   responsive  (default) auto-reflows columns→stack→tabs as the region shrinks,
#               so a spawn never hard-rejects on a narrow terminal.
layout: responsive

# Native-engine focus-follows-input (T-040). Ignored under engine: tmux.
# Env: SQUASH_FOCUS_FOLLOWS_INPUT. Flag: --focus-follows-input.
# When true, a pane that enters input_required auto-surfaces in the TUI (the
# in-TUI dual of the desktop-notification click). Set false to keep focus put
# and only paint the input badge.
focus_follows_input: true

terminal:
  # Terminal emulator command used when --no-tmux is active. Empty lets
  # squash-ide auto-detect (ptyxis -> gnome-terminal -> x-terminal-emulator).
  # Env: SQUASH_TERMINAL. Flag: --terminal.
  command: ""
  # Arguments template. {cwd} expands to the worktree path; {exec} expands
  # to the resolved spawn command (command + expanded args).
  args: ["--working-directory={cwd}", "--", "bash", "-c", "{exec}"]

spawn:
  # Command run inside each spawned pane/window. Env: SQUASH_SPAWN_CMD.
  # Flag: --spawn-cmd.
  command: claude
  # Arguments passed to the command. {task_id}, {title}, {project}, {cwd}
  # and {worktree} are interpolated from the dispatched task.
  args: ["/implement {task_id}"]

tmux:
  # Disable to fall back to one OS terminal window per spawn.
  enabled: true
  # Session name used by the tmux-bootstrap on TUI start. Re-attach with
  # `squash-ide` or `tmux attach -t <name>`.
  session_name: squash-ide
  # Cols pinned for the TUI on the left.
  tui_width: 60
  # Minimum cols per spawned pane. Spawn is rejected (not silently squeezed)
  # if a new pane would force any peer below this floor.
  min_pane_width: 80
